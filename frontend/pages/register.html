<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow - Create Account ✨</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="auth-page">

  <main class="auth-card">
    <div class="auth-header">
      <div class="auth-icon-badge">
        <i data-lucide="user-plus" style="width: 24px; height: 24px;"></i>
      </div>
      <h2 class="auth-title">📝 Create Account</h2>
      <p class="auth-subtitle">Start tracking your finances today 💰</p>
    </div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label">
          <i data-lucide="user" style="width: 14px; height: 14px;"></i> 👤 Full Name
        </label>
        <input type="text" id="reg-name" class="form-input" placeholder="e.g. John Doe" required>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i data-lucide="mail" style="width: 14px; height: 14px;"></i> 📧 Email Address
        </label>
        <input type="email" id="reg-email" class="form-input" placeholder="your@email.com" required>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i data-lucide="lock" style="width: 14px; height: 14px;"></i> 🔒 Password (min. 6 characters)
        </label>
        <input type="password" id="reg-password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn-submit">🚀 Sign Up</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">🔐 Sign in</a>
    </div>
  </main>

  <script type="module">
    import { Auth } from '../js/auth.js';
    import { UI } from '../js/ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      Auth.checkGuestGuard();
      if (window.lucide) window.lucide.createIcons();

      document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;

        try {
          await Auth.register(name, email, password);
          UI.showToast('✅ Account created successfully! Please sign in.', 'success');
          setTimeout(() => window.location.href = 'login.html', 1500);
        } catch (error) {
          UI.showToast(error.message, 'error');
        }
      });
    });
  </script>
</body>
</html>
