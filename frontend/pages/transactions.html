<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetFlow - Transactions 💰</title>
  <link rel="stylesheet" href="../css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="dashboard-layout">
    <div id="sidebar-container"></div>

    <main class="main-content">
      <header class="page-header">
        <div class="page-title-area">
          <h1>📋 Transactions</h1>
          <p>Manage and audit history logs for income and expenses 💵</p>
        </div>
        <button id="btn-open-modal" class="btn-action">
          <i data-lucide="plus" style="width: 16px; height: 16px;"></i> ✨ Add Entry
        </button>
      </header>

      <!-- Filter bar will be injected here by JavaScript -->
      
      <section class="content-block">
        <h2>📊 Transaction History</h2>
        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>📌 Title</th>
                <th>🔄 Type</th>
                <th>💵 Amount</th>
                <th>🏷️ Category</th>
                <th>📅 Date</th>
                <th>⚙️ Actions</th>
              </tr>
            </thead>
            <tbody id="transactions-table-body">
              <tr><td colspan="6" style="text-align: center; padding: 40px;">Loading transactions... 🔄</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL FORM for Create/Edit -->
  <div id="transaction-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modal-form-title">✨ New Transaction</h2>
        <button id="btn-close-modal" class="btn-close-modal"><i data-lucide="x"></i></button>
      </div>

      <form id="transaction-form">
        <input type="hidden" id="t-id">
        <div class="form-group">
          <label class="form-label">📝 Transaction Title</label>
          <input type="text" id="t-title" class="form-input" placeholder="e.g. Salary, Rent, Groceries" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">💰 Amount ($)</label>
            <input type="number" id="t-amount" class="form-input" step="0.01" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label class="form-label">🔄 Type</label>
            <select id="t-type" class="form-select" required>
              <option value="income">💰 Income (+)</option>
              <option value="expense">💸 Expense (-)</option>
            </select>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label">🏷️ Category</label>
            <input type="text" id="t-category" class="form-input" placeholder="e.g. Food, Utility, Leisure" required>
          </div>
          <div class="form-group">
            <label class="form-label">📅 Date</label>
            <input type="date" id="t-date" class="form-input" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">📝 Note (Optional)</label>
          <input type="text" id="t-note" class="form-input" placeholder="Brief comment or observation description">
        </div>

        <div class="modal-footer">
          <button type="button" id="btn-cancel-modal" class="btn-cancel">❌ Cancel</button>
          <button type="submit" class="btn-action" style="box-shadow: none;">💾 Save Transaction</button>
        </div>
      </form>
    </div>
  </div>

  <!-- VIEW MODAL for getTransactionById -->
  <div id="view-transaction-modal" class="modal-overlay">
    <div class="modal-card" style="max-width: 480px;">
      <div class="modal-header">
        <h2>🔍 Transaction Details</h2>
        <button id="btn-close-view-modal" class="btn-close-modal"><i data-lucide="x"></i></button>
      </div>
      <div style="margin-bottom: 20px;">
        <div style="background: var(--bg-input); padding: 16px; border-radius: var(--radius-md); margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
            <h3 id="view-title" style="font-size: 20px; margin: 0;">—</h3>
            <div id="view-type">—</div>
          </div>
          <div id="view-amount" style="font-size: 28px; font-weight: 700; margin-top: 12px;">—</div>
        </div>
        <div class="info-row"><span class="info-label">🏷️ Category</span><span id="view-category" class="info-value">—</span></div>
        <div class="info-row"><span class="info-label">📅 Date</span><span id="view-date" class="info-value">—</span></div>
        <div class="info-row"><span class="info-label">📝 Note</span><span id="view-note" class="info-value">—</span></div>
        <div class="info-row"><span class="info-label">🕐 Created at</span><span id="view-created" class="info-value">—</span></div>
      </div>
      <div class="modal-footer">
        <button id="btn-close-view-footer" class="btn-cancel">Close</button>
      </div>
    </div>
  </div>

  <script type="module" src="../js/transactions.js"></script>
  <script>
    if(window.lucide) lucide.createIcons();
    
    // Setup view modal close handlers
    document.addEventListener('DOMContentLoaded', () => {
      const closeViewModal = () => {
        const modal = document.getElementById('view-transaction-modal');
        if (modal) modal.classList.remove('active');
      };
      const closeBtn = document.getElementById('btn-close-view-modal');
      const closeFooter = document.getElementById('btn-close-view-footer');
      const modalOverlay = document.getElementById('view-transaction-modal');
      
      if (closeBtn) closeBtn.addEventListener('click', closeViewModal);
      if (closeFooter) closeFooter.addEventListener('click', closeViewModal);
      if (modalOverlay) {
        modalOverlay.addEventListener('click', (e) => {
          if (e.target === modalOverlay) closeViewModal();
        });
      }
    });
  </script>
</body>
</html>
