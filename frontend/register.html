<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - WalletApiAPI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.5s ease;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #E66239, #d55a2e);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .logo-icon i {
            font-size: 30px;
            color: white;
        }
        
        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e293b;
        }
        
        .auth-header p {
            color: #64748b;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
            font-size: 13px;
        }
        
        .form-group label i {
            margin-right: 8px;
            color: #E66239;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #E66239;
            box-shadow: 0 0 0 3px rgba(230,98,57,0.1);
        }
        
        .form-group input.error {
            border-color: #FB2C36;
        }
        
        .error-message {
            color: #FB2C36;
            font-size: 11px;
            margin-top: 4px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
        
        .password-strength {
            margin-top: 8px;
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        
        .password-strength-bar.weak { background: #FB2C36; width: 33%; }
        .password-strength-bar.medium { background: #F0B100; width: 66%; }
        .password-strength-bar.strong { background: #00C951; width: 100%; }
        
        .password-hint {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
        
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        
        .form-check input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .form-check label {
            font-size: 13px;
            color: #64748b;
        }
        
        .form-check label a {
            color: #E66239;
            text-decoration: none;
        }
        
        .btn-primary {
            background: #E66239;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-primary:hover {
            background: #d55a2e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(230,98,57,0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .auth-footer p {
            color: #64748b;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #E66239;
            text-decoration: none;
            font-weight: 600;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <h1>Create Account</h1>
                    <p>Join WalletApiAPI to manage your finances</p>
                </div>

                <form id="registerForm">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" id="fullName" placeholder="John Doe" required autofocus>
                        <div class="error-message" id="nameError">Name must be at least 3 characters</div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" placeholder="hello@example.com" required>
                        <div class="error-message" id="emailError">Please enter a valid email address</div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" placeholder="Create a password" required>
                        <div class="password-strength">
                            <div class="password-strength-bar" id="passwordStrengthBar"></div>
                        </div>
                        <div class="password-hint" id="passwordHint">
                            Minimum 6 characters
                        </div>
                        <div class="error-message" id="passwordError">Password must be at least 6 characters</div>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-check-circle"></i> Confirm Password</label>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
                        <div class="error-message" id="confirmError">Passwords do not match</div>
                    </div>
                    
                    <div class="form-check">
                        <input type="checkbox" id="termsCheckbox" required>
                        <label>
                            I agree to the <a href="#" id="termsLink">Terms of Service</a> and 
                            <a href="#" id="privacyLink">Privacy Policy</a>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-primary" id="registerBtn">
                        <i class="fas fa-user-plus"></i> Create Account
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Already have an account? <a href="login.html">Sign In</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notification"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Register page specific logic
        const registerForm = document.getElementById('registerForm');
        const fullNameInput = document.getElementById('fullName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const termsCheckbox = document.getElementById('termsCheckbox');
        const registerBtn = document.getElementById('registerBtn');
        
        // Check if already logged in
        if (auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }
        
        // Real-time validation
        function validateName() {
            const name = fullNameInput.value.trim();
            const isValid = name.length >= 3;
            const errorDiv = document.getElementById('nameError');
            
            if (name && !isValid) {
                errorDiv.classList.add('show');
                fullNameInput.classList.add('error');
            } else {
                errorDiv.classList.remove('show');
                fullNameInput.classList.remove('error');
            }
            return isValid;
        }
        
        function validateEmail() {
            const email = emailInput.value.trim();
            const isValid = validateEmailFormat(email);
            const errorDiv = document.getElementById('emailError');
            
            if (email && !isValid) {
                errorDiv.classList.add('show');
                emailInput.classList.add('error');
            } else {
                errorDiv.classList.remove('show');
                emailInput.classList.remove('error');
            }
            return isValid;
        }
        
        function validateEmailFormat(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        function checkPasswordStrength() {
            const password = passwordInput.value;
            const strengthBar = document.getElementById('passwordStrengthBar');
            const hint = document.getElementById('passwordHint');
            
            if (!password) {
                strengthBar.className = 'password-strength-bar';
                strengthBar.style.width = '0%';
                hint.innerHTML = 'Minimum 6 characters';
                return false;
            }
            
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            if (strength <= 1) {
                strengthBar.className = 'password-strength-bar weak';
                hint.innerHTML = 'Weak password';
            } else if (strength <= 3) {
                strengthBar.className = 'password-strength-bar medium';
                hint.innerHTML = 'Medium password';
            } else {
                strengthBar.className = 'password-strength-bar strong';
                hint.innerHTML = 'Strong password!';
            }
            
            return password.length >= 6;
        }
        
        function validatePassword() {
            const password = passwordInput.value;
            const isValid = password.length >= 6;
            const errorDiv = document.getElementById('passwordError');
            
            if (password && !isValid) {
                errorDiv.classList.add('show');
                passwordInput.classList.add('error');
            } else {
                errorDiv.classList.remove('show');
                passwordInput.classList.remove('error');
            }
            
            checkPasswordStrength();
            validateConfirmPassword();
            return isValid;
        }
        
        function validateConfirmPassword() {
            const password = passwordInput.value;
            const confirm = confirmPasswordInput.value;
            const isValid = password === confirm && password.length > 0;
            const errorDiv = document.getElementById('confirmError');
            
            if (confirm && !isValid) {
                errorDiv.classList.add('show');
                confirmPasswordInput.classList.add('error');
            } else {
                errorDiv.classList.remove('show');
                confirmPasswordInput.classList.remove('error');
            }
            return isValid;
        }
        
        // Add event listeners for real-time validation
        fullNameInput.addEventListener('input', validateName);
        emailInput.addEventListener('input', validateEmail);
        passwordInput.addEventListener('input', validatePassword);
        confirmPasswordInput.addEventListener('input', validateConfirmPassword);
        
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Validate all fields
            const isNameValid = validateName();
            const isEmailValid = validateEmail();
            const isPasswordValid = validatePassword();
            const isConfirmValid = validateConfirmPassword();
            const isTermsChecked = termsCheckbox.checked;
            
            if (!isNameValid) {
                showToast('Please enter your full name (minimum 3 characters)', 'error');
                fullNameInput.focus();
                return;
            }
            
            if (!isEmailValid) {
                showToast('Please enter a valid email address', 'error');
                emailInput.focus();
                return;
            }
            
            if (!isPasswordValid) {
                showToast('Password must be at least 6 characters', 'error');
                passwordInput.focus();
                return;
            }
            
            if (!isConfirmValid) {
                showToast('Passwords do not match', 'error');
                confirmPasswordInput.focus();
                return;
            }
            
            if (!isTermsChecked) {
                showToast('Please agree to the Terms of Service and Privacy Policy', 'error');
                return;
            }
            
            // Show loading state
            const originalText = registerBtn.innerHTML;
            registerBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';
            registerBtn.disabled = true;
            
            try {
                const name = fullNameInput.value.trim();
                const email = emailInput.value.trim();
                const password = passwordInput.value;
                
                const success = await auth.register(name, email, password);
                if (success) {
                    showToast('Account created successfully! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } catch (error) {
                showToast(error.message || 'Registration failed', 'error');
            } finally {
                registerBtn.innerHTML = originalText;
                registerBtn.disabled = false;
            }
        });
        
        // Terms and privacy links
        document.getElementById('termsLink')?.addEventListener('click', (e) => {
            e.preventDefault();
            showToast('Terms of Service: Use WalletApiAPI responsibly. Your data is secure with us.', 'info');
        });
        
        document.getElementById('privacyLink')?.addEventListener('click', (e) => {
            e.preventDefault();
            showToast('Privacy Policy: We protect your data and never share it with third parties.', 'info');
        });
    </script>
</body>
</html>
