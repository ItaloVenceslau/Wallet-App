<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions - WalletApiAPI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div id="app">
        <div id="dashboardContainer">
            <div class="loading-screen">
                <div class="loading-spinner"></div>
                <p>Loading Transactions...</p>
            </div>
        </div>
    </div>

    <div id="transactionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Transaction</h3>
                <button class="modal-close" onclick="closeModal('transactionModal')">&times;</button>
            </div>
            <div class="modal-body">
                <form id="transactionForm">
                    <input type="hidden" id="transactionId">
                    <div class="form-group">
                        <label>Title *</label>
                        <input type="text" id="transTitle" placeholder="e.g., Groceries, Salary" required>
                    </div>
                    <div class="form-group">
                        <label>Amount *</label>
                        <input type="number" id="transAmount" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label>Type *</label>
                        <select id="transType" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <input type="text" id="transCategory" placeholder="Food, Rent, Salary, etc." required>
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="transDate" required>
                    </div>
                    <div class="form-group">
                        <label>Note (Optional)</label>
                        <textarea id="transNote" rows="3" placeholder="Additional notes..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('transactionModal')">Cancel</button>
                <button class="btn btn-primary" onclick="saveTransaction()">Save Transaction</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notification"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/transactions.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Override to load transactions page directly
        window.addEventListener('DOMContentLoaded', async () => {
            if (!auth.isLoggedIn()) {
                window.location.href = 'login.html';
                return;
            }
            
            if (!window.transactionsManager) {
                window.transactionsManager = new TransactionsManager();
            }
            await window.transactionsManager.load();
        });
    </script>
</body>
</html>
