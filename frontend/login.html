<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - WalletApiAPI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        /* Additional styles for auth pages */
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }
        
        .auth-container {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.5s ease;
        }
        
        .auth-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .logo-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #E66239, #d55a2e);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }
        
        .logo-icon i {
            font-size: 30px;
            color: white;
        }
        
        .auth-header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #1e293b;
        }
        
        .auth-header p {
            color: #64748b;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #334155;
            font-size: 13px;
        }
        
        .form-group label i {
            margin-right: 8px;
            color: #E66239;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #E66239;
            box-shadow: 0 0 0 3px rgba(230,98,57,0.1);
        }
        
        .form-hint {
            margin-top: 6px;
            text-align: right;
        }
        
        .form-hint a {
            color: #E66239;
            text-decoration: none;
            font-size: 12px;
        }
        
        .btn-primary {
            background: #E66239;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn-primary:hover {
            background: #d55a2e;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(230,98,57,0.3);
        }
        
        .auth-footer {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .auth-footer p {
            color: #64748b;
            font-size: 14px;
        }
        
        .auth-footer a {
            color: #E66239;
            text-decoration: none;
            font-weight: 600;
        }
        
        .demo-credentials {
            background: #f8fafc;
            border-radius: 10px;
            padding: 12px;
            margin-top: 20px;
            text-align: center;
        }
        
        .demo-credentials p {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 8px;
        }
        
        .demo-credentials code {
            background: #e2e8f0;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="logo-icon">
                        <i class="fas fa-wallet"></i>
                    </div>
                    <h1>Welcome Back</h1>
                    <p>Sign in to your WalletApiAPI account</p>
                </div>

                <form id="loginForm">
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" id="email" placeholder="hello@example.com" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label><i class="fas fa-lock"></i> Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <div class="form-hint">
                            <a href="#" id="forgotPassword">Forgot password?</a>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-sign-in-alt"></i> Sign In
                    </button>
                </form>

                <div class="demo-credentials">
                    <p><i class="fas fa-info-circle"></i> Demo Credentials</p>
                    <code>Email: demo@example.com</code><br>
                    <code>Password: 12345678</code>
                </div>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="register.html">Create Account</a></p>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast-notification"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Login page specific logic
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        // Check if already logged in
        if (auth.isLoggedIn()) {
            window.location.href = 'index.html';
        }
        
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            if (!email || !password) {
                showToast('Please fill in all fields', 'error');
                return;
            }
            
            if (!validateEmail(email)) {
                showToast('Please enter a valid email address', 'error');
                return;
            }
            
            // Show loading state
            const submitBtn = loginForm.querySelector('button');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
            submitBtn.disabled = true;
            
            try {
                const success = await auth.login(email, password);
                if (success) {
                    showToast('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                }
            } catch (error) {
                showToast(error.message || 'Login failed', 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // Forgot password
        document.getElementById('forgotPassword')?.addEventListener('click', (e) => {
            e.preventDefault();
            showToast('Password reset feature coming soon. Please contact support.', 'info');
        });
        
        // Demo credentials autofill
        const demoFill = () => {
            emailInput.value = 'demo@example.com';
            passwordInput.value = '12345678';
        };
        
        // Add demo fill button (optional)
        const demoDiv = document.querySelector('.demo-credentials');
        if (demoDiv) {
            demoDiv.style.cursor = 'pointer';
            demoDiv.addEventListener('click', demoFill);
        }
    </script>
</body>
</html>
