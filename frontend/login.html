<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | FinanceFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100;14..32,200;14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
    <style>
        /* Additional styles for login page */
        .social-login {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--gray-200);
        }
        
        .social-buttons {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }
        
        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.625rem;
            background: white;
            border: 1px solid var(--gray-200);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all var(--transition);
            font-weight: 500;
            color: var(--gray-700);
        }
        
        .social-btn:hover {
            background: var(--gray-50);
            transform: translateY(-2px);
            box-shadow: var(--shadow-sm);
        }
        
        .forgot-password {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }
        
        .forgot-password a {
            font-size: 0.75rem;
            color: var(--gray-500);
            text-decoration: none;
        }
        
        .forgot-password a:hover {
            color: var(--primary);
        }
        
        .demo-credentials {
            background: linear-gradient(135deg, var(--primary-ultra-light) 0%, rgba(59, 130, 246, 0.05) 100%);
            padding: 1rem;
            border-radius: var(--radius-lg);
            margin-top: 1.5rem;
        }
        
        .demo-credentials p {
            font-size: 0.75rem;
            margin: 0.25rem 0;
            color: var(--gray-600);
        }
        
        .demo-credentials code {
            background: white;
            padding: 0.125rem 0.375rem;
            border-radius: var(--radius-sm);
            font-size: 0.7rem;
            color: var(--primary-dark);
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .error-shake {
            animation: shake 0.3s ease;
        }
    </style>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="auth-header">
                <div class="auth-logo">
                    💰
                </div>
                <h1>Welcome Back</h1>
                <p>Sign in to continue to FinanceFlow</p>
            </div>
            
            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label required">Email Address</label>
                    <input type="email" id="email" class="form-input" name="email" required placeholder="john@example.com">
                    <div class="form-help">Enter your registered email address</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label required">Password</label>
                    <input type="password" id="password" class="form-input" name="password" required placeholder="••••••••">
                    <div class="forgot-password">
                        <a href="#">Forgot password?</a>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                    <span>🔐</span> Sign In
                </button>
            </form>
            
            <!-- Social Login Options -->
            <div class="social-login">
                <p style="text-align: center; font-size: 0.75rem; color: var(--gray-500);">Or continue with</p>
                <div class="social-buttons">
                    <button class="social-btn" onclick="alert('Google login coming soon!')">
                        <span>🔵</span> Google
                    </button>
                    <button class="social-btn" onclick="alert('Facebook login coming soon!')">
                        <span>🔷</span> Facebook
                    </button>
                    <button class="social-btn" onclick="alert('Apple login coming soon!')">
                        <span>🍎</span> Apple
                    </button>
                </div>
            </div>
            
            <!-- Demo Credentials (Development only) -->
            <div class="demo-credentials">
                <p style="font-weight: 600; margin-bottom: 0.5rem;">📝 Demo Credentials</p>
                <p>Email: <code>demo@financeflow.com</code></p>
                <p>Password: <code>demo123</code></p>
                <p style="font-size: 0.7rem; margin-top: 0.5rem; color: var(--gray-500);">⚠️ For testing purposes only</p>
            </div>
            
            <!-- Register Link -->
            <div class="auth-footer">
                <p>
                    Don't have an account? 
                    <a href="register.html">Create free account</a>
                </p>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check if user is already logged in
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = 'dashboard.html';
        }
        
        // Form submission handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            
            // Basic validation
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            // Email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError('Please enter a valid email address');
                return;
            }
            
            // Show loading state
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<div class="spinner-sm" style="margin: 0 auto;"></div>';
            loginBtn.disabled = true;
            
            try {
                const result = await api.auth.login({ email, password });
                localStorage.setItem('token', result.token);
                
                // Store user info if returned
                if (result.user) {
                    localStorage.setItem('userName', result.user.name);
                    localStorage.setItem('userEmail', result.user.email);
                }
                
                // Show success toast
                showToast('Login successful! Redirecting...', 'success');
                
                // Redirect to dashboard
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
                
            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Invalid email or password');
                
                // Reset button
                loginBtn.innerHTML = originalText;
                loginBtn.disabled = false;
            }
        });
        
        // Error handling function
        function showError(message) {
            // Remove existing error
            const existingError = document.querySelector('.form-error');
            if (existingError) existingError.remove();
            
            // Create error element
            const errorDiv = document.createElement('div');
            errorDiv.className = 'form-error error-shake';
            errorDiv.style.cssText = `
                background: rgba(239, 68, 68, 0.1);
                color: var(--danger);
                padding: 0.75rem;
                border-radius: var(--radius);
                margin-bottom: 1rem;
                font-size: 0.875rem;
                text-align: center;
            `;
            errorDiv.innerHTML = `⚠️ ${message}`;
            
            // Insert at top of form
            const form = document.getElementById('loginForm');
            form.insertBefore(errorDiv, form.firstChild);
            
            // Auto-remove after 3 seconds
            setTimeout(() => {
                if (errorDiv) errorDiv.remove();
            }, 3000);
        }
        
        // Toast notification
        function showToast(message, type = 'success') {
            const toastContainer = document.querySelector('.toast-container') || (() => {
                const container = document.createElement('div');
                container.className = 'toast-container';
                document.body.appendChild(container);
                return container;
            })();
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${type === 'success' ? '✓' : '⚠️'}</div>
                <div class="toast-message">${message}</div>
                <button class="toast-close" onclick="this.parentElement.remove()">×</button>
            `;
            
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                toast.remove();
            }, 3000);
        }
        
        // Add floating labels effect
        const inputs = document.querySelectorAll('.form-input');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
        
        // Demo credentials auto-fill
        const demoEmail = document.getElementById('email');
        const demoPassword = document.getElementById('password');
        
        // Optional: Auto-fill demo credentials for testing
        // Uncomment the lines below to auto-fill demo credentials
        // demoEmail.value = 'demo@financeflow.com';
        // demoPassword.value = 'demo123';
    </script>
</body>
</html>
